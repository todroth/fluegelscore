<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#5A7A65"/>

  <!-- Bird silhouette in profile, facing right -->
  <g fill="white">
    <!-- Body -->
    <ellipse cx="215" cy="292" rx="138" ry="94" transform="rotate(-12 215 292)"/>
    <!-- Head -->
    <circle cx="330" cy="214" r="68"/>
    <!-- Beak -->
    <path d="M380 202 L452 217 L380 232Z"/>
    <!-- Tail (fan shape) -->
    <path d="M88 264
             C62 246, 30 234, 20 240
             C36 258, 48 278, 48 296
             C48 314, 36 334, 20 352
             C30 358, 62 346, 88 328
             Z"/>
    <!-- Eye cutout (green circle — makes it look like a real bird) -->
  </g>
  <!-- Eye -->
  <circle cx="346" cy="204" r="14" fill="#5A7A65"/>
  <circle cx="350" cy="200" r="5" fill="white"/>
</svg>

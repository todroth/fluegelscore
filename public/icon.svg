<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#5A7A65"/>

  <!--
    Feather at 45° — tip upper-right, calamus lower-left.
    Outer vane (upper-left of rachis) is wider than inner vane:
    this asymmetry is what makes it read as a feather, not a leaf.
  -->

  <!-- Vane -->
  <path d="M400 112
           C379 133, 255 115, 205 152
           C152 195, 140 270, 148 364
           C183 330, 240 292, 296 248
           C352 204, 391 158, 400 112Z"
        fill="white"/>

  <!-- Rachis (central quill through vane) -->
  <line x1="400" y1="112" x2="148" y2="364"
        stroke="#3A5847" stroke-width="9" stroke-linecap="round" opacity="0.45"/>

  <!-- Calamus (bare quill below vane) -->
  <line x1="148" y1="364" x2="90" y2="448"
        stroke="white" stroke-width="9" stroke-linecap="round"/>

  <!-- Outer barbs (upper-left side — longer) -->
  <line x1="362" y1="150" x2="323" y2="111" stroke="#3A5847" stroke-width="5.5" stroke-linecap="round" opacity="0.28"/>
  <line x1="324" y1="188" x2="253" y2="117" stroke="#3A5847" stroke-width="5.5" stroke-linecap="round" opacity="0.28"/>
  <line x1="287" y1="225" x2="209" y2="147" stroke="#3A5847" stroke-width="5.5" stroke-linecap="round" opacity="0.28"/>
  <line x1="249" y1="263" x2="189" y2="203" stroke="#3A5847" stroke-width="5.5" stroke-linecap="round" opacity="0.28"/>
  <line x1="211" y1="301" x2="176" y2="266" stroke="#3A5847" stroke-width="5.5" stroke-linecap="round" opacity="0.28"/>

  <!-- Inner barbs (lower-right side — shorter) -->
  <line x1="362" y1="150" x2="380" y2="168" stroke="#3A5847" stroke-width="5.5" stroke-linecap="round" opacity="0.28"/>
  <line x1="324" y1="188" x2="352" y2="216" stroke="#3A5847" stroke-width="5.5" stroke-linecap="round" opacity="0.28"/>
  <line x1="287" y1="225" x2="321" y2="259" stroke="#3A5847" stroke-width="5.5" stroke-linecap="round" opacity="0.28"/>
  <line x1="249" y1="263" x2="276" y2="290" stroke="#3A5847" stroke-width="5.5" stroke-linecap="round" opacity="0.28"/>
  <line x1="211" y1="301" x2="227" y2="317" stroke="#3A5847" stroke-width="5.5" stroke-linecap="round" opacity="0.28"/>
</svg>

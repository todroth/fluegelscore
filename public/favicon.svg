<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#5A7A65"/>

  <!-- Vane (asymmetric — outer/upper-left wider) -->
  <path d="M25 7
           C24 8, 16 7, 13 9.5
           C9.5 12, 8.8 17, 9.3 22.8
           C11.4 20.6, 15 18, 18.5 15.5
           C22 13, 24.5 10, 25 7Z"
        fill="white"/>

  <!-- Rachis -->
  <line x1="25" y1="7" x2="9.3" y2="22.8"
        stroke="#3A5847" stroke-width="0.85" stroke-linecap="round" opacity="0.45"/>

  <!-- Calamus -->
  <line x1="9.3" y1="22.8" x2="5.5" y2="28"
        stroke="white" stroke-width="1.1" stroke-linecap="round"/>

  <!-- Outer barbs -->
  <line x1="22.5" y1="9.5" x2="20" y2="7" stroke="#3A5847" stroke-width="0.6" stroke-linecap="round" opacity="0.32"/>
  <line x1="19.5" y1="12.5" x2="15.5" y2="8.5" stroke="#3A5847" stroke-width="0.6" stroke-linecap="round" opacity="0.32"/>
  <line x1="16" y1="16" x2="12" y2="11.5" stroke="#3A5847" stroke-width="0.6" stroke-linecap="round" opacity="0.32"/>
  <line x1="12.5" y1="19.5" x2="9.5" y2="16.5" stroke="#3A5847" stroke-width="0.6" stroke-linecap="round" opacity="0.32"/>

  <!-- Inner barbs -->
  <line x1="22.5" y1="9.5" x2="23.5" y2="10.5" stroke="#3A5847" stroke-width="0.6" stroke-linecap="round" opacity="0.32"/>
  <line x1="19.5" y1="12.5" x2="21.5" y2="14.5" stroke="#3A5847" stroke-width="0.6" stroke-linecap="round" opacity="0.32"/>
  <line x1="16" y1="16" x2="18" y2="18" stroke="#3A5847" stroke-width="0.6" stroke-linecap="round" opacity="0.32"/>
  <line x1="12.5" y1="19.5" x2="14" y2="21" stroke="#3A5847" stroke-width="0.6" stroke-linecap="round" opacity="0.32"/>
</svg>

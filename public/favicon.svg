  <path d="M15.5 10 C13.5 11 11 12 10 12.5" stroke="#3A5847" stroke-width="0.7" stroke-linecap="round" fill="none" opacity="0.3"/>
  <path d="M16.3 17 C18.5 18.2 21 19.5 22 20" stroke="#3A5847" stroke-width="0.7" stroke-linecap="round" fill="none" opacity="0.3"/>
  <path d="M15.7 17 C13.5 18.2 11 19.5 10 20" stroke="#3A5847" stroke-width="0.7" stroke-linecap="round" fill="none" opacity="0.3"/>
